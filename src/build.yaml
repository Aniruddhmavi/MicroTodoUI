name: Build and Push Docker Image to Azure Container Registry

on:
  push:
    branches:
      - main  # change if needed

permissions:
  contents: read   # self-hosted runner ke liye sirf ye chahiye

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Azure login using Service Principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}  # JSON secret
          auth-type: service-principal

      # Step 3: Login to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name imageregistryacr

      # Step 4: Build Docker image
      - name: Build Docker image
        run: docker build -t todo-ui:v1 .

      # Step 5: Tag Docker image for ACR
      - name: Tag Docker image
        run: docker tag todo-ui:v1 imageregistryacr.azurecr.io/todo-ui:v1

      # Step 6: Push Docker image to ACR
      - name: Push Docker image to ACR
        run: docker push imageregistryacr.azurecr.io/todo-ui:v1
